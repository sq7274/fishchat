<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>大肥鱼</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1116;color:#e6edf3;
    font:15px/1.6 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;
    overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}

  header{flex:0 0 auto;display:flex;align-items:center;gap:9px;
    padding:calc(env(safe-area-inset-top) + 11px) 15px 11px;
    border-bottom:1px solid #17222c}
  #dot{width:7px;height:7px;border-radius:50%;background:#2c3a47;flex:0 0 auto}
  #dot.on{background:#4ec9b0}
  #dot.err{background:#c9737a}
  header .t{font-size:14px;font-weight:600;letter-spacing:.01em}
  header .s{font-size:11px;color:#5a6a78}
  header .sp{flex:1}
  header button{background:none;border:none;color:#7d8b99;font-size:13px;padding:6px 2px 6px 10px}

  #msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bub{max-width:84%;padding:9px 13px;border-radius:15px;
    white-space:pre-wrap;word-break:break-word;font-size:15px}
  .row.me .bub{background:#1c3748;color:#e2f2ff;border-bottom-right-radius:5px}
  .row.ai .bub{background:#151e26;color:#dbe4ec;border-bottom-left-radius:5px}
  .row.ai .bub:empty::after{content:"…";color:#4a5a68}
  .err{color:#c9737a}
  .row.ai .col{max-width:84%;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .row.ai .col .bub{max-width:100%}
  .steps{max-width:100%;font-size:12px;line-height:1.6}
  .steps .hp{display:inline-flex;align-items:center;gap:6px;background:#101922;
    border:1px solid #17222c;border-radius:9px;padding:4px 10px;font-size:12px;color:#66788a}
  .steps .hp .cv{font-size:8px;color:#3f4e5c;transition:transform .16s}
  .steps.open .hp .cv{transform:rotate(90deg)}
  .steps .bd{display:none;margin:5px 0 0;padding:0 0 0 10px;border-left:1px solid #1e2b36;
    white-space:pre-wrap;color:#5f7285;max-height:38vh;overflow-y:auto;font-size:12px;
    -webkit-overflow-scrolling:touch}
  .steps.open .bd{display:block}
  .meta{font-size:11px;color:#3f4e5c;letter-spacing:.02em}
  .meta:empty{display:none}
  .empty{margin:auto;text-align:center;color:#4a5a68;font-size:13px;line-height:2}

  footer{flex:0 0 auto;display:flex;gap:9px;align-items:flex-end;
    padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);
    border-top:1px solid #17222c;background:#0b1116}
  #inp{flex:1;background:#131c24;border:1px solid #1e2b36;border-radius:19px;
    color:#e6edf3;padding:10px 15px;font:15px/1.5 inherit;resize:none;outline:none;
    max-height:132px;overflow-y:auto;min-height:41px}
  #inp:focus{border-color:#2a4557}
  #inp::placeholder{color:#4a5a68}
  #send{background:#1c3748;border:none;color:#8fd8f5;border-radius:19px;
    padding:10px 17px;font:15px inherit;flex:0 0 auto}
  #send:disabled{opacity:.35}
  #plus{background:none;border:1px solid #1e2b36;color:#7d8b99;border-radius:50%;
    width:41px;height:41px;flex:0 0 auto;font:20px/1 inherit;padding:0 0 2px}
  #plus:active{border-color:#2a4557;color:#9fe0ff}
  .bub img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:0 0 6px}
  .bub.onlyimg{padding:4px;background:#131c24}
  #preview{display:none;gap:10px;align-items:center;padding:9px 12px 0}
  #preview.show{display:flex}
  #preview img{width:52px;height:52px;object-fit:cover;border-radius:9px;border:1px solid #1e2b36}
  #preview .x{color:#7d8b99;font-size:13px;padding:5px 4px}
  #preview .pn{font-size:11px;color:#5a6a78;flex:1}
  #wipe{background:#161e26;color:#c9737a}

  #panel{position:fixed;inset:0;background:#080d11;display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);z-index:9}
  #panel.show{display:flex}
  #panel h2{font-size:14px;margin:0 0 18px;font-weight:600;color:#b8c4d0}
  .f{margin-bottom:14px}
  .f label{display:block;font-size:11px;color:#5a6a78;margin-bottom:6px;letter-spacing:.04em}
  .f input{width:100%;background:#131c24;border:1px solid #1e2b36;border-radius:9px;
    color:#e6edf3;padding:10px 12px;font:12px/1.4 ui-monospace,SFMono-Regular,monospace;outline:none}
  .f input:focus{border-color:#2a4557}
  .f .h{font-size:11px;color:#4a5a68;margin-top:5px}
  #log{font:11px/1.55 ui-monospace,SFMono-Regular,monospace;color:#6b7a88;
    white-space:pre-wrap;word-break:break-all;background:#0d1419;border:1px solid #17222c;
    border-radius:9px;padding:10px;max-height:40vh;overflow:auto;margin-bottom:14px;display:none}
  #log.show{display:block}
  #panel .btns{display:flex;gap:10px;margin-top:auto}
  .f label.chk{display:flex;align-items:center;gap:7px;color:#d7e2ea;font-size:13px;margin:0}
  .f label.chk input{width:auto;height:auto;margin:0}
  #panel .btns button{flex:1;padding:12px;border-radius:11px;border:none;font:14px inherit}
  #ok{background:#1c3748;color:#9fe0ff}
  #close{background:#161e26;color:#8b98a6}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="dot"></span>
    <span class="t">大肥鱼</span>
    <span class="s" id="stat">未连接</span>
    <span class="sp"></span>
    <button id="btnSet">设置</button>
  </header>
  <div id="msgs"><div class="empty">还没说话</div></div>
  <div id="preview">
    <img id="pImg" alt="">
    <span class="pn" id="pName">图片</span>
    <span class="x" id="pDel">×</span>
  </div>
  <footer>
    <button id="plus">+</button>
    <textarea id="inp" rows="1" placeholder="说点什么"></textarea>
    <button id="send" disabled>发</button>
  </footer>
  <input type="file" id="pick" accept="image/*" style="display:none">
</div>

<div id="panel">
  <h2>连接设置</h2>
  <div class="f">
    <label>接口地址</label>
    <input id="cUrl" spellcheck="false">
    <div class="h">AstrBot 在手机本地，一般不用改</div>
  </div>
  <div class="f">
    <label>API KEY</label>
    <input id="cKey" spellcheck="false">
    <div class="h">WebUI → 系统设置 → OpenAPI 里建的，abk_ 开头</div>
  </div>
  <div class="f">
    <label>用户名</label>
    <input id="cUser" spellcheck="false">
    <div class="h">不能填管理员 ID，否则会被拒</div>
  </div>
  <div class="f">
    <label>会话 ID</label>
    <input id="cSess" spellcheck="false">
    <div class="h">换个值就是开一段新对话</div>
  </div>
  <div class="f">
    <label>图片</label>
    <div class="h">发图会先传到 AstrBot 再一起发。现在这模型看不见画面，只知道有张图。</div>
  </div>
  <div id="log"></div>
  <div class="btns">
    <button id="wipe">清空记录</button>
    <button id="close">关掉</button>
    <button id="ok">保存</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var DEF = {
    url: 'http://127.0.0.1:6185/api/v1/chat',
    key: 'abk_u2QiHqqOB5YBu2htdW_eSDMXG90CBWADeo4wLZ7hFkI',
    user: 'youzhan',
    session: 'fish_app'
  };

  var cfg = load();
  var msgs = document.getElementById('msgs');
  var inp = document.getElementById('inp');
  var sendBtn = document.getElementById('send');
  var dot = document.getElementById('dot');
  var stat = document.getElementById('stat');
  var logBox = document.getElementById('log');
  var seq = 0;
  var pending = {};
  var logs = [];

  function load() {
    try {
      var raw = localStorage.getItem('fish_cfg');
      if (raw) return Object.assign({}, DEF, JSON.parse(raw));
    } catch (e) {}
    return Object.assign({}, DEF);
  }

  function save() {
    try { localStorage.setItem('fish_cfg', JSON.stringify(cfg)); } catch (e) {}
  }

  function setDot(cls, txt) {
    dot.className = cls;
    stat.textContent = txt;
  }

  function log(s) {
    logs.push(s);
    if (logs.length > 140) logs.shift();
    logBox.textContent = logs.join('\n');
    logBox.scrollTop = logBox.scrollHeight;
  }

  function clearEmpty() {
    var e = msgs.querySelector('.empty');
    if (e) e.remove();
  }

  function atBottom() {
    return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 90;
  }

  function scroll() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addRow(who, text, img) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row ' + who;
    var bub = document.createElement('div');
    bub.className = 'bub';
    if (img) {
      var im = document.createElement('img');
      im.src = img;
      bub.appendChild(im);
      if (!text) bub.className = 'bub onlyimg';
    }
    if (text) bub.appendChild(document.createTextNode(text));
    row.appendChild(bub);
    msgs.appendChild(row);
    scroll();
    return bub;
  }

  /* 一条 AI 回复 = 折叠步骤条 + 正文气泡 + 用量小字 */
  function addAiTurn() {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row ai';
    var col = document.createElement('div');
    col.className = 'col';
    var steps = document.createElement('div');
    steps.className = 'steps';
    steps.style.display = 'none';
    var bub = document.createElement('div');
    bub.className = 'bub';
    var meta = document.createElement('div');
    meta.className = 'meta';
    col.appendChild(steps);
    col.appendChild(bub);
    col.appendChild(meta);
    row.appendChild(col);
    msgs.appendChild(row);
    scroll();
    return { bub: bub, steps: steps, meta: meta };
  }

  /* --- 聊天记录：按 session 存在本地 --- */
  var hist = [];
  var HKEY = 'fish_hist_' + cfg.session;

  function loadHist() {
    try {
      var raw = localStorage.getItem(HKEY);
      var a = raw ? JSON.parse(raw) : [];
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }

  function saveHist() {
    try {
      while (hist.length > 120) hist.shift();
      localStorage.setItem(HKEY, JSON.stringify(hist));
    } catch (e) {
      /* 存不下就减半再试一次 */
      try {
        hist = hist.slice(-40);
        localStorage.setItem(HKEY, JSON.stringify(hist));
      } catch (e2) {}
    }
    saveNative();
  }

  /* 再往手机文件里写一份，重启才不丢 */
  function saveNative() {
    try {
      if (!(window.AndroidApp && window.AndroidApp.saveHist)) return;
      var s = JSON.stringify(hist);
      if (s.length > 2500000) {
        for (var i = 0; i < hist.length && s.length > 2500000; i++) {
          if (hist[i].img) { hist[i].img = ''; s = JSON.stringify(hist); }
        }
      }
      window.AndroidApp.saveHist(cfg.session, s);
    } catch (e) {}
  }

  /* 原生把上次的记录送回来 */
  window.__histLoaded = function (sess, json) {
    if (sess !== cfg.session || !json) return;
    try {
      var a = JSON.parse(json);
      if (!Array.isArray(a) || !a.length) return;
      if (a.length <= hist.length) return;   /* 本地的没少就不折腾 */
      hist = a;
      msgs.innerHTML = '';
      renderHist();
      scroll();
    } catch (e) {}
  };

  function pushHist(rec) {
    hist.push(rec);
    saveHist();
  }

  function renderHist() {
    if (!hist.length) return;
    var e = msgs.querySelector('.empty');
    if (e) e.remove();
    for (var i = 0; i < hist.length; i++) {
      var r = hist[i] || {};
      if (r.who === 'me') { addRow('me', r.text || '', r.img || ''); continue; }
      var t = addAiTurn();
      applySplit(t, r.text || '');
      if (r.meta) t.meta.textContent = r.meta;
    }
    scroll();
  }

  /* 从任意形状的 JSON 里抠出文本 */
  function pick(o, d) {
    d = d || 0;
    if (d > 4 || o == null) return '';
    if (typeof o === 'string') return o;
    if (typeof o !== 'object') return '';
    var keys1 = ['text', 'content', 'delta', 'message', 'msg', 'chunk'];
    var i, v, r;
    for (i = 0; i < keys1.length; i++) {
      v = o[keys1[i]];
      if (typeof v === 'string' && v) return v;
      if (v && typeof v === 'object') {
        r = pick(v, d + 1);
        if (r) return r;
      }
    }
    var keys2 = ['data', 'result', 'parts', 'content'];
    for (i = 0; i < keys2.length; i++) {
      v = o[keys2[i]];
      if (v && typeof v === 'object') {
        r = pick(v, d + 1);
        if (r) return r;
      }
    }
    return '';
  }

  /* 原生是按行回调的；万一整块进来也拆开处理 */
  window.__chunk = function (id, chunk) {
    var st = pending[id];
    if (!st || !chunk) return;
    var lines = String(chunk).split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) onChunkLine(st, lines[i]);
  };

  /* 增量拼接：全量覆盖 / 重复回滚 / 纯增量三种都兜住 */
  function mergeDelta(cur, txt) {
    cur = cur || '';
    if (!txt) return cur;
    if (txt.indexOf(cur) === 0) return txt;
    if (cur && cur.indexOf(txt) === 0) return cur;
    if (cur && txt.length > 8 && cur.slice(-txt.length) === txt) return cur;
    return cur + txt;
  }

  /* 正文按空行拆成多条气泡——像 QQ 那样一句一条 */
  function applySplit(st, text) {
    var col = st && st.bub ? st.bub.parentNode : null;
    if (!col) return;
    var old = col.querySelectorAll('.bub.extra');
    for (var k = 0; k < old.length; k++) col.removeChild(old[k]);
    var raw = String(text == null ? '' : text);
    var list = raw.split(/\n{2,}/);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i].replace(/^\s+|\s+$/g, '');
      if (t) out.push(t);
    }
    if (!out.length) { st.bub.textContent = ''; return; }
    st.bub.textContent = out[0];
    var prev = st.bub;
    for (var j = 1; j < out.length; j++) {
      var b = document.createElement('div');
      b.className = 'bub extra';
      b.textContent = out[j];
      col.insertBefore(b, prev.nextSibling);
      prev = b;
    }
  }


  function toolNameOf(s) {
    try {
      var o = JSON.parse(s);
      if (o && typeof o === 'object') {
        if (o.name) return String(o.name);
        if (o.function && o.function.name) return String(o.function.name);
      }
    } catch (e) {}
    var m = /"name"\s*:\s*"([^"]+)"/.exec(String(s));
    return m ? m[1] : '';
  }

  /* 折叠步骤条：思考 N 次 · 用了 M 次工具 */
  function paintSteps(st) {
    st.pq = 0;
    if (!st.steps || (!st.thinkN && !st.tools.length)) return;
    st.steps.style.display = '';
    if (!st.hp) {
      st.hp = document.createElement('div');
      st.hp.className = 'hp';
      var cv = document.createElement('span');
      cv.className = 'cv';
      cv.textContent = '▶';
      var tt = document.createElement('span');
      tt.className = 'tt';
      st.hp.appendChild(cv);
      st.hp.appendChild(tt);
      st.hp.addEventListener('click', function () { st.steps.classList.toggle('open'); });
      st.steps.appendChild(st.hp);
      st.bd = document.createElement('div');
      st.bd.className = 'bd';
      st.steps.appendChild(st.bd);
    }
    var bits = [];
    if (st.thinkN) bits.push('思考 ' + st.thinkN + ' 次');
    if (st.tools.length) bits.push('用了 ' + st.tools.length + ' 次工具');
    st.hp.querySelector('.tt').textContent = bits.join(' · ') + (st.done ? '' : ' ···');
    var body = st.rtext || '';
    if (st.tools.length) body += (body ? '\n\n' : '') + st.tools.join('\n');
    if (st.bd.textContent !== body) st.bd.textContent = body;
    if (st.steps.classList.contains('open')) st.bd.scrollTop = st.bd.scrollHeight;
    if (atBottom()) scroll();
  }

  function queuePaint(st) {
    if (st.pq) return;
    st.pq = 1;
    setTimeout(function () { paintSteps(st); }, 90);
  }

  function onChunkLine(st, line) {
    if (!line) return;

    var raw;
    if (line.indexOf('data:') === 0) raw = line.slice(5).trim();
    else if (/^\s*[[{]/.test(line)) raw = line.trim();   /* 非 SSE 的裸 JSON，多半是错误 */
    else return;
    if (!raw || raw === '[DONE]') return;
    if (raw === '[HB]' || raw === ':' || raw.indexOf(':') === 0) return;

    var o;
    try { o = JSON.parse(raw); } catch (e) { return; }
    if (!o || typeof o !== 'object') return;

    /* 服务端把错误当 200 返回时会走到这 */
    if (o.status === 'error' || o.type === 'error' || o.type === 'err') {
      st.err = String(o.message || o.data || raw).slice(0, 300);
      st.bub.className = 'bub err';
      st.bub.textContent = '出错了：' + st.err;
      return;
    }

    /* 用量：整轮结束才推一次 */
    if (o.type === 'agent_stats') {
      if (o.data && typeof o.data === 'object') st.stats = o.data;
      return;
    }

    var piece = '';
    if (typeof o.data === 'string') piece = o.data;
    else if (o.data && typeof o.data === 'object') {
      piece = (typeof o.data.text === 'string' && o.data.text) ||
              (typeof o.data.content === 'string' && o.data.content) || '';
    }

    var kind = o.chain_type || o.type || '';
    if (kind !== st.lastKind) {
      if (kind === 'reasoning') st.thinkN = (st.thinkN | 0) + 1;
      st.lastKind = kind;
    }

    /* 思考过程：实时往折叠条里追加 */
    if (o.chain_type === 'reasoning') {
      if (piece) {
        if (!st.rfirst) { st.rfirst = 1; st.steps.classList.add('open'); }
        st.rtext = mergeDelta(st.rtext, piece);
        if (st.rtext.length > 40000) st.rtext = st.rtext.slice(-40000);
        queuePaint(st);
      }
      setDot('', '想事情');
      return;
    }

    /* 工具调用：只记名字和次数，不把参数糊到界面上 */
    if (o.chain_type === 'tool_call') {
      var nm = toolNameOf(piece || raw);
      if (!st.tools.length || st.tools[st.tools.length - 1] !== '· ' + (nm || '工具')) {
        st.tools.push('· ' + (nm || '工具'));
      }
      st.brk = 1;
      queuePaint(st);
      return;
    }
    if (o.chain_type === 'tool_call_result') { st.brk = 1; return; }

    /* 只认正文类事件；状态、快照这些不显示 */
    if (o.type && ['plain', 'text', 'image', 'record', 'end'].indexOf(o.type) < 0) return;

    var txt = piece;
    if (!txt && o.choices && o.choices[0] && o.choices[0].delta) {
      txt = o.choices[0].delta.content || '';
    }
    if (!txt) return;

    /* 兜底：漏出来的工具调用 / 内部 JSON 不往界面上怼 */
    if (/^\s*\{\s*"(id|name|args|arguments|tool_calls|ts)"/.test(txt)) return;

    /* 隔了工具调用，新一段正文另起一段，别糊成一坨 */
    if (st.brk) {
      st.brk = 0;
      if (!(st.text && txt.indexOf(st.text) === 0) && txt.charAt(0) !== '\n') {
        txt = '\n\n' + txt;
      }
    }

    st.text = mergeDelta(st.text, txt);
    if (!st.mounted) { st.mounted = true; }
    st.bub.textContent = st.text;
    setDot('', '说话中');
    if (atBottom()) scroll();
  };

  function fmtN(n) {
    n = n | 0;
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* 一轮结束：步骤条定格收起，底部写上这轮吃了多少 token */
  function finishTurn(st) {
    st.done = 1;
    if (st.bub && st.text) applySplit(st, st.text);
    if (st.steps) {
      st.steps.classList.remove('open');
      paintSteps(st);
    }
    if (!st.meta) return;
    var s = st.stats || {};
    var u = s.token_usage || {};
    var inTok = (u.input_other | 0) + (u.input_cached | 0);
    var outTok = u.output | 0;
    var tot = inTok + outTok;
    var bits = [];
    if (tot) {
      bits.push('↑' + fmtN(inTok) + ' ↓' + fmtN(outTok) + ' · 共 ' + fmtN(tot) + ' token');
    }
    var dur = (s.end_time && s.start_time) ? (s.end_time - s.start_time) : 0;
    if (dur > 0) bits.push(dur.toFixed(1) + 's');
    if (s.time_to_first_token > 0) {
      bits.push('首字 ' + Number(s.time_to_first_token).toFixed(1) + 's');
    }
    st.meta.textContent = bits.join(' · ');
  }

  window.__done = function (id, code, err) {
    var st = pending[id];
    if (!st) return;
    delete pending[id];
    if (st.kind === 'pull') { handlePull(code, err); return; }
    finishTurn(st);
    log('> status ' + code + (err ? ' ' + String(err).slice(0, 400) : ''));
    if (code === 200) {
      if (!st.text) {
        if (st.err) {
          setDot('err', '出错');
        } else {
          setDot('on', '在线');
          st.bub.textContent = st.thinkN ? '（想了想，没说）' : '（没说话）';
        }
      } else {
        setDot('on', '在线');
        pushHist({
          who: 'ai', text: st.text, img: '',
          meta: st.meta ? st.meta.textContent : ''
        });
      }
    } else if (code === 0) {
      setDot('err', '连不上');
      st.bub.className = 'bub err';
      st.bub.textContent = '连不上 AstrBot。看看它还在不在跑，地址对不对。';
    } else {
      setDot('err', 'HTTP ' + code);
      st.bub.className = 'bub err';
      st.bub.textContent = '出错了（' + code + '）\n' + String(err).slice(0, 400);
    }
    sendBtn.disabled = false;
    if (atBottom()) scroll();
  };

  function native(fn, args) {
    if (window.AndroidApp && typeof window.AndroidApp[fn] === 'function') {
      window.AndroidApp[fn].apply(window.AndroidApp, args);
      return true;
    }
    log('!! 没有 AndroidApp 桥，可能在浏览器里打开的');
    return false;
  }

  /* --- 选图 / 上传 --- */
  var pick = document.getElementById('pick');
  var preview = document.getElementById('preview');
  var pImg = document.getElementById('pImg');
  var pName = document.getElementById('pName');
  var pendingImg = null;   /* {b64, data, name} */

  document.getElementById('plus').addEventListener('click', function () {
    /* 老版原生自带选图上传，新版走网页自己的 input file */
    if (window.AndroidApp && typeof window.AndroidApp.pickImage === 'function') {
      var id = ++seq;
      pending[id] = { bub: null, text: '', said: inp.value.trim(), err: '', aid: '', np: true };
      setDot('', '选图中');
      try {
        window.AndroidApp.pickImage(String(id), cfg.url.replace(/\/chat$/, '') + '/files', cfg.key);
      } catch (e) { delete pending[id]; pick.click(); }
      return;
    }
    pick.click();
  });

  /* 老版原生的选图回调：__imageResult(id, ok, attachmentId, name) */
  window.__imageResult = function (id, ok, aid) {
    var st = pending[id];
    if (!st) return;
    delete pending[id];
    setDot('', '在线');
    if (!ok) { log('!! 选图没成 ' + String(aid).slice(0, 200)); return; }
    var text = inp.value.trim();
    addRow('me', text, '');
    pushHist({ who: 'me', text: text, img: '' });
    inp.value = '';
    inp.style.height = 'auto';
    sendBtn.disabled = true;
    var bub = addRow('ai', '');
    var id2 = ++seq;
    pending[id2] = { bub: bub, text: '', said: text, err: '', aid: aid };
    fireChat(id2, pending[id2]);
  };

  document.getElementById('pDel').addEventListener('click', clearPick);

  function clearPick() {
    pendingImg = null;
    pick.value = '';
    preview.classList.remove('show');
    pImg.removeAttribute('src');
    sendBtn.disabled = !inp.value.trim();
  }

  function fitImg(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var w = im.width, h = im.height;
        var mk = function (maxw, q) {
          var k = Math.min(1, maxw / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(w * k));
          cv.height = Math.max(1, Math.round(h * k));
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          return cv.toDataURL('image/jpeg', q);
        };
        cb(mk(1280, 0.82), mk(360, 0.62));
      };
      im.onerror = function () { cb(null, null); };
      im.src = fr.result;
    };
    fr.onerror = function () { cb(null, null); };
    fr.readAsDataURL(file);
  }

  pick.addEventListener('change', function () {
    var f = pick.files && pick.files[0];
    if (!f) return;
    if (f.size > 12 * 1024 * 1024) {
      pName.textContent = '太大了，换张小点的';
      preview.classList.add('show');
      return;
    }
    fitImg(f, function (big, small) {
      if (!big) { pName.textContent = '读不出来这张'; preview.classList.add('show'); return; }
      pendingImg = { b64: big.split(',')[1] || '', data: big, thumb: small, name: f.name || 'image.jpg' };
      pImg.src = big;
      pName.textContent = f.name || '图片';
      preview.classList.add('show');
      sendBtn.disabled = false;
      scroll();
    });
  });

  /* 原生把 base64 传回：__uploaded(id, code, resp) */
  window.__uploaded = function (id, code, resp) {
    var st = pending[id];
    if (!st) return;
    if (code !== 200) {
      st.bub.className = 'bub err';
      st.bub.textContent = '图片没传上去（' + code + '）\n' + String(resp).slice(0, 300);
      delete pending[id];
      sendBtn.disabled = false;
      setDot('err', '上传失败');
      return;
    }
    var aid = '';
    try {
      var o = JSON.parse(resp);
      aid = (o && o.data && o.data.attachment_id) || (o && o.attachment_id) || '';
    } catch (e) {}
    if (!aid) {
      st.bub.className = 'bub err';
      st.bub.textContent = '图片上传没拿到 id：' + String(resp).slice(0, 300);
      delete pending[id];
      sendBtn.disabled = false;
      return;
    }
    st.bub.textContent = '';
    st.aid = aid;
    log('> 上传成功 ' + aid);
    fireChat(id, st);
  };

  function fireChat(id, st) {
    var parts = [];
    var said = st.said || '';
    if (st.aid) {
      /* 图一定带上，模型至少知道有图；看不看得见取决于模型 */
      parts.push({ type: 'image', attachment_id: st.aid });
      if (!said) said = '（发了张图）';
    }
    if (said) parts.push({ type: 'plain', text: said });
    var body = JSON.stringify({
      username: cfg.user,
      session_id: cfg.session,
      message: parts,
      enable_streaming: true
    });
    log('> POST ' + cfg.url + ' ' + body.slice(0, 300));
    setDot('', '说话中');
    native('chat', [String(id), cfg.url, cfg.key, body]);
  }

  function send() {
    var text = inp.value.trim();
    var pic = pendingImg;
    if (!text && !pic) return;
    if (!window.AndroidApp) {
      addRow('me', text, pic ? pic.thumb : '');
      var b = addRow('ai', '');
      b.className = 'bub err';
      b.textContent = '这不是在 APP 里打开的，没有原生通道。';
      return;
    }

    addRow('me', text, pic ? pic.thumb : '');
    pushHist({ who: 'me', text: text || '', img: pic ? pic.thumb : '' });

    inp.value = '';
    inp.style.height = 'auto';
    sendBtn.disabled = true;

    var id = ++seq;
    var turn = addAiTurn();
    pending[id] = {
      bub: turn.bub, steps: turn.steps, meta: turn.meta,
      text: '', said: text, err: '', aid: '',
      rtext: '', tools: [], thinkN: 0
    };

    if (pic) {
      clearPick();
      sendBtn.disabled = true;
      var upUrl = cfg.url.replace(/\/chat$/, '') + '/files';
      log('> 上传图片 ' + pic.name + ' -> ' + upUrl);
      setDot('', '传图中');
      pending[id].text = text;
      native('upload', [String(id), upUrl, cfg.key, pic.b64, pic.name]);
      return;
    }
    clearPick();
    fireChat(id, pending[id]);
  }

  /* --- 输入框 --- */
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 132) + 'px';
    sendBtn.disabled = !(inp.value.trim() || pendingImg);
  });

  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) send();
    }
  });

  sendBtn.addEventListener('click', send);

  /* --- 设置 --- */
  var panel = document.getElementById('panel');

  document.getElementById('btnSet').addEventListener('click', function () {
    document.getElementById('cUrl').value = cfg.url;
    document.getElementById('cKey').value = cfg.key;
    document.getElementById('cUser').value = cfg.user;
    document.getElementById('cSess').value = cfg.session;
    logBox.classList.add('show');
    panel.classList.add('show');
  });

  document.getElementById('close').addEventListener('click', function () {
    panel.classList.remove('show');
  });

  document.getElementById('ok').addEventListener('click', function () {
    var oldKey = HKEY;
    cfg.url = document.getElementById('cUrl').value.trim() || DEF.url;
    cfg.key = document.getElementById('cKey').value.trim();
    cfg.user = document.getElementById('cUser').value.trim() || DEF.user;
    cfg.session = document.getElementById('cSess').value.trim() || DEF.session;
    save();
    panel.classList.remove('show');
    setDot('', '未连接');
    HKEY = 'fish_hist_' + cfg.session;
    if (HKEY !== oldKey) {
      hist = loadHist();
      msgs.innerHTML = '';
      if (!hist.length) msgs.innerHTML = '<div class="empty">还没说话</div>';
      renderHist();
    }
    ping();
  });

  document.getElementById('wipe').addEventListener('click', function () {
    if (!confirm('清掉这段对话在本地的记录？服务器那边的还在。')) return;
    hist = [];
    try { localStorage.removeItem(HKEY); } catch (e) {}
    msgs.innerHTML = '<div class="empty">还没说话</div>';
    panel.classList.remove('show');
  });

  /* 回来时探一下活着没 */
  function ping() {
    if (!window.AndroidApp || !cfg.key) return;
    var base = cfg.url.replace(/\/api\/v1\/chat$/, '');
    var id = ++seq;
    pending[id] = { bub: document.createElement('div'), text: '', probe: true };
    var u = base + '/api/v1/chat/sessions?username=' + encodeURIComponent(cfg.user) + '&page=1&page_size=1';
    window.AndroidApp.get(String(id), u, cfg.key);
    log('> GET ' + u);
  }

  /* 开局：把上次的聊天贴回来 */
  hist = loadHist();
  if (hist.length) renderHist();
  if (window.AndroidApp && window.AndroidApp.loadHist) {
    try { window.AndroidApp.loadHist(cfg.session); } catch (e) {}
  }

  /* --- 主动消息：每 5 秒问一次 6186，有新东西就摆上来 --- */
  var PUSH = {
    base: 'http://127.0.0.1:6186',
    token: 'fishpush_7Kq2mZ'
  };
  var pushTs = 0;
  var pushBusy = false;
  var pushN = 0;
  try { pushTs = parseFloat(localStorage.getItem('fish_pushts') || '0') || 0; } catch (e) {}

  var pushT = 0;

  function pullOnce() {
    if (pushBusy) return;
    if (!(window.AndroidApp && window.AndroidApp.get)) return;
    pushBusy = true;
    /* id 必须是数字：原生回调拼的是 __done(-1,...)，给字符串会变成未定义变量 */
    var id = --pushN;
    pending[id] = { kind: 'pull' };
    native('get', [id, PUSH.base + '/pull?since=' + pushTs + '&token=' + PUSH.token, '']);
    clearTimeout(pushT);
    pushT = setTimeout(function () { pushBusy = false; }, 15000);
  }

  function handlePull(code, body) {
    pushBusy = false;
    clearTimeout(pushT);
    if (code !== 200) return;
    var list = [], now = 0;
    try {
      var o = JSON.parse(body);
      now = o.now || 0;
      list = Array.isArray(o.msgs) ? o.msgs : [];
    } catch (e) { return; }
    if (list.length > 10) list = list.slice(-10);
    var maxTs = pushTs, i, m, t, u;
    for (i = 0; i < list.length; i++) {
      m = list[i] || {};
      t = m.ts || 0;
      if (t > maxTs) maxTs = t;
      if ((m.type || 'text') === 'file' && (m.url || m.id)) {
        u = m.url || ('/file/' + m.id);
        if (!/^https?:/.test(u)) u = PUSH.base + u;
        if (!/[?&]token=/.test(u)) u += (u.indexOf('?') < 0 ? '?' : '&') + 'token=' + PUSH.token;
        if (/\.(png|jpe?g|gif|webp|bmp)([?#]|$)/i.test(m.name || u)) {
          addRow('ai', '', u);
          pushHist({ who: 'ai', text: '', img: u });
        } else {
          var txt = (m.name || '附件') + '\n' + u;
          addRow('ai', '［文件］' + txt, '');
          pushHist({ who: 'ai', text: '［文件］' + txt, img: '' });
        }
      } else if (m.text) {
        addRow('ai', m.text, '');
        pushHist({ who: 'ai', text: m.text, img: '' });
      }
    }
    if (maxTs > pushTs) {
      pushTs = maxTs;
      try { localStorage.setItem('fish_pushts', String(pushTs)); } catch (e) {}
    }
    if (!list.length) return;
    if (atBottom()) scroll();
    flashDot();
  }

  var flashT = 0;
  function flashDot() {
    if (panel && panel.classList.contains('show')) return;
    setDot('on', '有新消息');
    clearTimeout(flashT);
    flashT = setTimeout(function () { setDot('on', '在线'); }, 6000);
  }

  (function loopPush() {
    pullOnce();
    setTimeout(loopPush, 5000);
  })();

  setTimeout(ping, 600);
})();
</script>
